name: Build and Push Multi-arch Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_ALIAS: philly1084/cli-model-gateway
  EXTRA_NPM_GLOBAL_PACKAGES: "@google/gemini-cli@0.46.0 @openai/codex@0.144.1 opencode-ai@1.17.7 @xai-official/grok@0.2.93"

jobs:
  validate:
    name: Validate catalog and source
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gateway-catalog-validation
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and Kubernetes release inputs
        run: |
          bash -n scripts/promote-remote-agent-handoff.sh
          npm run preflight:k8s
          npm run preflight:remote-targets
          npm run check
          npm run build
          npm test

      - name: Verify Codex and Kimi provider reconciliation, promotion, and canary gates
        run: |
          npm run preflight:kimi-k3
          npm run canary:remote-agent-handoff:dry-run
          npm run test:remote-agent-handoff-release

  build:
    name: Build and Push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and Kubernetes release inputs
        run: |
          bash -n scripts/promote-remote-agent-handoff.sh
          npm run preflight:k8s
          npm run preflight:remote-targets
          npm run check
          npm run build
          npm test

      - name: Verify Codex and Kimi provider reconciliation, promotion, and canary gates
        run: |
          npm run preflight:kimi-k3
          npm run canary:remote-agent-handoff:dry-run
          npm run test:remote-agent-handoff-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ALIAS }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            EXTRA_NPM_GLOBAL_PACKAGES=${{ env.EXTRA_NPM_GLOBAL_PACKAGES }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest trusted promotion image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_ALIAS }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest-pinned promotion reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo 'promotion_image=${{ env.REGISTRY }}/${{ env.IMAGE_ALIAS }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
