providers:
  - id: gemini-cli
    type: cli
    description: Gemini CLI adapter
    models:
      - id: gemini-3.1-pro-preview
        providerModel: gemini-3.1-pro-preview
        fallbackModels:
          - gemini-3.5-flash
          - gemini-3-flash-preview
          - gpt-5.5
          - gpt-5.4
      - id: gemini-3.5-flash
        providerModel: gemini-3.5-flash
        fallbackModels:
          - gemini-3.1-pro-preview
          - gemini-3-flash-preview
          - gpt-5.5
          - gpt-5.4
          - kimi-k2.6
      - id: gemini-3-flash-preview
        providerModel: gemini-3-flash-preview
        fallbackModels:
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gpt-5.5
          - gpt-5.4
      - id: gemini-3.1-flash-lite
        providerModel: gemini-3.1-flash-lite
        fallbackModels:
          - gemini-3.5-flash
          - gemini-3-flash-preview
      - id: gemini-2.5-pro
        providerModel: gemini-2.5-pro
        fallbackModels:
          - gemini-3.1-pro-preview
          - gemini-3.5-flash
      - id: gemini-2.5-flash
        providerModel: gemini-2.5-flash
        fallbackModels:
          - gemini-2.5-flash-lite
          - gemini-3.5-flash
          - gemini-3-flash-preview
      - id: gemini-2.5-flash-lite
        providerModel: gemini-2.5-flash-lite
        fallbackModels:
          - gemini-3.1-flash-lite
          - gemini-2.5-flash
          - gemini-3.5-flash
          - openrouter-free
    responseCommand:
      executable: node
      args:
        - dist/scripts/gemini-cli-bridge.js
        - --model
        - "{{provider_model}}"
      input: request_json_stdin
      output: json_contract
      timeoutMs: 240000
    sessionCommand:
      executable: gemini
      args: []
      env:
        TERM: xterm-256color
      supportsWorkingDirectory: true
      idleTimeoutMs: 1800000
      maxLifetimeMs: 14400000
      ptyMode: auto
    auth:
      loginCommand:
        executable: sh
        args:
          - -c
          - |
            echo "Gemini CLI login is interactive in this version."
            echo "Run in a TTY shell: gemini"
            echo "Then run: /auth and choose Login with Google."
            exit 1
        timeoutMs: 900000
      statusCommand:
        executable: sh
        args:
          - -c
          - |
            test -f "$HOME/.gemini/oauth_creds.json" \
              && echo '{"ok":true,"source":"oauth_creds.json"}' \
              || (echo '{"ok":false,"error":"missing ~/.gemini/oauth_creds.json"}' && exit 1)
        timeoutMs: 30000
      # Example: Rate limit check command
      # This should output JSON with rate limit information
      # rateLimitCommand:
      #   executable: opencode
      #   args:
      #     - account
      #     - limits
      #     - --json
      #   timeoutMs: 30000

  - id: antigravity-cli
    type: cli
    description: Antigravity CLI adapter
    models:
      - id: antigravity-default
        providerModel: default
    responseCommand:
      executable: antigravity
      args:
        - chat
        - --model
        - "{{provider_model}}"
        - --json
      input: request_json_stdin
      output: json_contract
      timeoutMs: 240000
    auth:
      loginCommand:
        executable: antigravity
        args:
          - auth
          - login
          - --no-browser
        timeoutMs: 900000
      statusCommand:
        executable: antigravity
        args:
          - auth
          - status
          - --json
        timeoutMs: 30000

