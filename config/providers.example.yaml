          - gpt-5.4-mini
          - gpt-5.4-nano
          - kimi-k2.6
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
      - id: gpt-5.4-pro
        providerModel: gpt-5.4-pro
        fallbackModels:
          - gpt-5.5
          - gpt-5.4
          - kimi-k2.6
          - gemini-3.1-pro-preview
      - id: gpt-5.4-mini
        providerModel: gpt-5.4-mini
        fallbackModels:
          - gpt-5.4
          - gpt-5.5
          - gpt-5.4-nano
          - kimi-k2.6
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
      - id: gpt-5.4-nano
        providerModel: gpt-5.4-nano
        fallbackModels:
          - gpt-5.4-mini
          - gpt-5.4
          - gemini-3.1-flash-lite
          - llama-3.1-8b-instant
      - id: gpt-5.3-instant
        providerModel: gpt-5.3-instant
        fallbackModels:
          - gpt-5.5
          - gpt-5.4
          - kimi-k2.6
          - gemini-3.5-flash
      - id: gpt-5.3-chat-latest
        providerModel: gpt-5.3-chat-latest
        fallbackModels:
          - gpt-5.5
          - gpt-5.4
          - kimi-k2.6
          - gemini-3.5-flash
      - id: gpt-4.1
        providerModel: gpt-4.1
        fallbackModels:
          - gpt-5.3-chat-latest
          - gpt-5.3-instant
          - kimi-k2.6
          - gemini-3.5-flash
    responseCommand:
      executable: node
      args:
        - dist/scripts/codex-appserver-bridge.js
        - --model
        - "{{provider_model}}"
      input: request_json_stdin
      output: json_contract
      timeoutMs: 600000
    sessionCommand:
      executable: node
      args:
        - dist/scripts/remote-agent-session-bridge.js
        - --provider
        - codex
        - --session
        - "{{session_id}}"
      supportsModelSelection: true
      modelFlag: --model
      supportsWorkingDirectory: true
      closeInputAfterWrite: true
      idleTimeoutMs: 1800000
      maxLifetimeMs: 14400000
      ptyMode: pipe
    auth:
      loginCommand:
        executable: "{{codex_executable}}"
        args:
          - login
          - --device-auth
        timeoutMs: 900000
      statusCommand:
        executable: "{{codex_executable}}"
        args:
          - login
