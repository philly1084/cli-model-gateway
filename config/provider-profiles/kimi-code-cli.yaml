id: kimi-code-cli
type: cli
auth:
  env: KIMI_CODE_API_KEY
  statusCommand:
    executable: node
    args:
      - -e
      - >-
        const {spawnSync}=require('node:child_process');
        const ok=Boolean(process.env.KIMI_CODE_API_KEY)&&spawnSync('kimi-code',['--version'],{stdio:'ignore'}).status===0;
        console.log(JSON.stringify({ok}));process.exit(ok?0:1);
    timeoutMs: 30000
command:
  executable: node
  args:
    - dist/scripts/kimi-acp-bridge.js
    - --model
    - "{{provider_model}}"
  input: request_json_stdin
  output: json_contract
stream_format: buffered-json
quirks:
  duplicate_finish_trailer: false
  json_array_errors: false
  unsupported_model_patterns: []
  refusal_patterns: []
  retry_on:
    - 429
    - 503
  backoff_ms: 150
  auth_fail_fast: true
  timeouts:
    first_token: 60000
    total: 240000
capabilities:
  tools: false
  json_mode: true
  system_prompt: native
normalization:
  strip_think: true
  strip_fence: false
