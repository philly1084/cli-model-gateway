id: kimi-code-api
type: openai
baseUrl: https://api.kimi.com/coding/v1
endpoint: /messages
auth:
  env: KIMI_CODE_API_KEY
stream_format: anthropic-json
quirks:
  duplicate_finish_trailer: false
  json_array_errors: false
  unsupported_model_patterns: []
  refusal_patterns: []
  retry_on:
    - 429
    - 503
  backoff_ms: 150
  auth_fail_fast: true
  timeouts:
    first_token: 60000
    total: 240000
capabilities:
  tools: true
  json_mode: true
  system_prompt: native
normalization:
  strip_think: true
  strip_fence: false
