id: agy-subscription
type: cli
auth:
  env: AGY_SUBSCRIPTION_ENABLED
  statusCommand:
    executable: node
    args:
      - dist/scripts/agy-subscription-bridge.js
      - --status
    timeoutMs: 30000
command:
  executable: node
  args:
    - dist/scripts/agy-subscription-bridge.js
    - --model
    - "{{provider_model}}"
  input: request_json_stdin
  output: json_contract
stream_format: buffered-json
quirks:
  duplicate_finish_trailer: false
  json_array_errors: false
  unsupported_model_patterns:
    - \bmodel\b[^\r\n]{0,256}\b(?:is\s+)?not supported\b
  refusal_patterns: []
  retry_on:
    - 429
    - 503
  backoff_ms: 150
  auth_fail_fast: true
  timeouts:
    first_token: 60000
    total: 600000
capabilities:
  tools: false
  json_mode: true
  system_prompt: native
normalization:
  strip_think: true
  strip_fence: false
models:
  - id: agy-gemini-4-neon
    providerModel: gemini-4-neon
    capabilities: [chat, responses]
    manualOnly: true
    autoEligible: false
  - id: agy-gemini-4-hydrogen
    providerModel: gemini-4-hydrogen
    capabilities: [chat, responses]
    manualOnly: true
    autoEligible: false
