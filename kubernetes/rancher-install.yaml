apiVersion: v1
kind: Namespace
metadata:
  name: n8n-openai-gateway
  labels:
    app.kubernetes.io/name: n8n-openai-cli-gateway
---
# The n8n-openai-cli-gateway-secrets Secret is intentionally not defined here.
# Create or fill missing keys with scripts/ensure-gateway-secrets.* so Rancher
# imports never overwrite existing cluster passwords.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-openai-cli-gateway
  namespace: n8n-openai-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-openai-cli-gateway-config
  namespace: n8n-openai-gateway
data:
  providers.yaml: |
    providers:
      - id: gemini-cli
        type: cli
        description: Gemini CLI adapter
        models:
          - id: gemini-3.1-pro-preview
            providerModel: gemini-3.1-pro-preview
            fallbackModels:
              - gemini-3.5-flash
              - gemini-3-flash-preview
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: gemini-3.5-flash
            providerModel: gemini-3.5-flash
            fallbackModels:
              - gemini-3.1-pro-preview
              - gemini-3-flash-preview
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: gemini-3-flash-preview
            providerModel: gemini-3-flash-preview
            fallbackModels:
              - gemini-3.5-flash
              - gemini-3.1-pro-preview
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: gemini-3.1-flash-lite
            providerModel: gemini-3.1-flash-lite
            fallbackModels:
              - gemini-3.5-flash
              - gemini-3-flash-preview
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: gemini-2.5-pro
            providerModel: gemini-2.5-pro
            fallbackModels:
              - gemini-3.1-pro-preview
              - gemini-3.5-flash
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: gemini-2.5-flash
            providerModel: gemini-2.5-flash
            fallbackModels:
              - gemini-2.5-flash-lite
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3-flash-preview
          - id: gemini-2.5-flash-lite
            providerModel: gemini-2.5-flash-lite
            fallbackModels:
              - gemini-3.1-flash-lite
              - gemini-2.5-flash
              - gemini-3.5-flash
              - openrouter-free
        responseCommand:
          executable: node
          args:
            - dist/scripts/gemini-cli-bridge.js
            - --model
            - "{{provider_model}}"
          input: request_json_stdin
          output: json_contract
          timeoutMs: 240000
        auth:
          loginCommand:
            executable: sh
            args:
              - -c
              - |
                echo "Gemini CLI login is interactive in this version."
                echo "Run in a TTY shell: gemini"
                echo "Then run: /auth and choose Login with Google."
                exit 1
            timeoutMs: 900000
          statusCommand:
            executable: sh
            args:
              - -c
              - |
                test -f "$HOME/.gemini/oauth_creds.json" \
                  && echo '{"ok":true,"source":"oauth_creds.json"}' \
                  || (echo '{"ok":false,"error":"missing ~/.gemini/oauth_creds.json"}' && exit 1)
            timeoutMs: 30000

      - id: codex-cli
        type: cli
        description: OpenAI Codex app-server bridge adapter
        models:
          - id: gpt-image-2
            providerModel: codex-latest
            description: OpenAI Image 2.0 via Codex CLI image generation
            capabilities:
              - image_generation
          - id: gpt-5.6-sol
            providerModel: gpt-5.6-sol
            description: GPT-5.6 frontier model for maximum capability
            fallbackModels:
              - gpt-5.6-terra
              - gpt-5.6-luna
              - gpt-5.5
              - gpt-5.4
          - id: gpt-5.6-terra
            providerModel: gpt-5.6-terra
            description: GPT-5.6 model balancing intelligence and cost
            fallbackModels:
              - gpt-5.6-sol
              - gpt-5.6-luna
              - gpt-5.5
              - gpt-5.4
          - id: gpt-5.6-luna
            providerModel: gpt-5.6-luna
            description: GPT-5.6 model for efficient high-volume workloads
            fallbackModels:
              - gpt-5.6-terra
              - gpt-5.6-sol
              - gpt-5.5
              - gpt-5.4
          - id: gpt-5.5
            providerModel: gpt-5.5
            fallbackModels:
              - gpt-5.4
              - gpt-5.4-mini
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3-flash-preview
          - id: gpt-5.5-pro
            providerModel: gpt-5.5-pro
            fallbackModels:
              - gpt-5.5
              - gpt-5.4-pro
              - kimi-k2.6
              - gemini-3.1-pro-preview
          - id: gpt-5.4
            providerModel: gpt-5.4
            fallbackModels:
              - gpt-5.5
              - gpt-5.4-mini
              - gpt-5.4-nano
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3-flash-preview
          - id: gpt-5.4-pro
            providerModel: gpt-5.4-pro
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - gemini-3.1-pro-preview
          - id: gpt-5.4-mini
            providerModel: gpt-5.4-mini
            fallbackModels:
              - gpt-5.4
              - gpt-5.5
              - gpt-5.4-nano
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3.1-pro-preview
          - id: gpt-5.4-nano
            providerModel: gpt-5.4-nano
            fallbackModels:
              - gpt-5.4-mini
              - gpt-5.4
              - gemini-3.1-flash-lite
              - llama-3.1-8b-instant
          - id: gpt-5.3-instant
            providerModel: gpt-5.3-instant
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3-flash-preview
          - id: gpt-5.3-chat-latest
            providerModel: gpt-5.3-chat-latest
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - gemini-3.5-flash
          - id: gpt-4.1
            providerModel: gpt-4.1
            fallbackModels:
              - gpt-5.3-chat-latest
              - gpt-5.3-instant
              - kimi-k2.6
              - kimi-for-coding
              - gemini-3.5-flash
              - gemini-3-flash-preview
        responseCommand:
          executable: node
          args:
            - dist/scripts/codex-appserver-bridge.js
            - --model
            - "{{provider_model}}"
          input: request_json_stdin
          output: json_contract
          timeoutMs: 600000
        auth:
          loginCommand:
            executable: "{{codex_executable}}"
            args:
              - login
              - --device-auth
            timeoutMs: 900000
          statusCommand:
            executable: "{{codex_executable}}"
            args:
              - login
              - status
            timeoutMs: 30000

      - id: kimi-code-cli
        type: cli
        description: Kimi Code ACP bridge adapter
        models:
          - id: kimi-for-coding
            providerModel: kimi-for-coding
            fallbackModels:
              - kimi-k2.7-code
              - kimi-k2.6
              - gpt-5.5
              - gpt-5.4
        responseCommand:
          executable: node
          args:
            - dist/scripts/kimi-acp-bridge.js
            - --model
            - "{{provider_model}}"
          input: request_json_stdin
          output: json_contract
          timeoutMs: 240000
        auth:
          loginCommand:
            executable: sh
            args:
              - -c
              - |
                echo "Kimi CLI login is interactive."
                echo "Run in a TTY shell: kimi"
                echo "Then run: /login and complete auth."
                echo "If your installed minor version still uses /setup, use that instead."
                exit 1
            timeoutMs: 900000
          statusCommand:
            executable: sh
            args:
              - -c
              - |
                if [ -f "$HOME/.kimi/config.toml" ] || [ -f "$HOME/.kimi/config.json" ]; then
                  echo '{"ok":true,"source":"~/.kimi/config.toml"}'
                  exit 0
                fi
                echo '{"ok":false,"error":"missing ~/.kimi/config.toml or ~/.kimi/config.json (run kimi then /login, or /setup on older releases)"}'
                exit 1
            timeoutMs: 30000

      - id: kimi-code-api
        type: openai
        description: Kimi Code API OpenAI-compatible endpoint
        baseUrl: https://api.kimi.com/coding/v1
        apiKeyEnv: KIMI_CODE_API_KEY
        timeoutMs: 240000
        models:
          - id: kimi-k2.7-code
            providerModel: kimi-k2.7-code
            fallbackModels:
              - kimi-for-coding
              - kimi-k2.6
              - kimi-k2.5
              - gpt-5.5
              - gpt-5.4
              - gemini-3.5-flash
              - deepseek-v4-flash
          - id: kimi-k2.7-code-highspeed
            providerModel: kimi-k2.7-code-highspeed
            fallbackModels:
              - kimi-k2.7-code
              - kimi-for-coding
              - kimi-k2.6
              - kimi-k2.5
              - gpt-5.5
              - gpt-5.4
              - gemini-3.5-flash
              - deepseek-v4-flash

      - id: kimi-api
        type: openai
        description: Kimi API via Moonshot OpenAI-compatible endpoint
        baseUrl: https://api.moonshot.ai/v1
        apiKeyEnv: MOONSHOT_API_KEY
        timeoutMs: 240000
        models:
          - id: kimi-k2.6
            providerModel: kimi-k2.6
            fallbackModels:
              - kimi-k2.5
              - gpt-5.5
              - gpt-5.4
              - gemini-3.5-flash
              - deepseek-v4-flash
          - id: kimi-k2.5
            providerModel: kimi-k2.5
            fallbackModels:
              - kimi-k2.6
              - gpt-5.4
              - gemini-3.5-flash
              - deepseek-v4-flash

      - id: groq-api
        type: openai
        description: Groq API - auto-discovers chat-usable models at startup
        baseUrl: https://api.groq.com/openai/v1
        apiKeyEnv: GROQ_API_KEY
        timeoutMs: 60000
        discovery:
          enabled: true
          include:
            - qwen/qwen3-32b
            - meta-llama/llama-4-scout-17b-16e-instruct
            - groq/compound
            - groq/compound-mini
            - openai/gpt-oss-120b
            - openai/gpt-oss-20b
            - llama-3.3-70b-versatile
            - llama-3.1-8b-instant
        models:
          - id: groq/compound
            providerModel: groq/compound
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - openai/gpt-oss-20b
          - id: groq/compound-mini
            providerModel: groq/compound-mini
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - openai/gpt-oss-20b
          - id: openai/gpt-oss-120b
            providerModel: openai/gpt-oss-120b
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - openai/gpt-oss-20b
          - id: openai/gpt-oss-20b
            providerModel: openai/gpt-oss-20b
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
              - llama-3.1-8b-instant
          - id: llama-3.3-70b-versatile
            providerModel: llama-3.3-70b-versatile
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: llama-3.1-8b-instant
            providerModel: llama-3.1-8b-instant
            fallbackModels:
              - gpt-5.5
              - gpt-5.4
              - kimi-k2.6
              - kimi-for-coding
          - id: meta-llama/llama-4-scout-17b-16e-instruct
            providerModel: meta-llama/llama-4-scout-17b-16e-instruct
            fallbackModels:
              - llama-3.3-70b-versatile
              - openai/gpt-oss-20b
              - gpt-5.4

      - id: openrouter-free
        type: openai
        description: OpenRouter curated zero-priced model router
        baseUrl: https://openrouter.ai/api/v1
        apiKeyEnv: OPENROUTER_API_KEY
        timeoutMs: 120000
        models:
          - id: openrouter-free
            providerModel: openrouter/free
            fallbackModels:
              - qwen/qwen3-coder:free
              - moonshotai/kimi-k2.6:free
              - nvidia/nemotron-3-super-120b-a12b:free
              - openai/gpt-oss-120b:free
              - meta-llama/llama-3.3-70b-instruct:free
          - id: qwen/qwen3-coder:free
            providerModel: qwen/qwen3-coder:free
            description: Free OpenRouter coding model with long-context tool support
            fallbackModels:
              - moonshotai/kimi-k2.6:free
              - nvidia/nemotron-3-super-120b-a12b:free
              - openai/gpt-oss-120b:free
              - openrouter-free
          - id: moonshotai/kimi-k2.6:free
            providerModel: moonshotai/kimi-k2.6:free
            description: Free OpenRouter Kimi K2.6 lane for agentic coding and long context
            fallbackModels:
              - qwen/qwen3-coder:free
              - nvidia/nemotron-3-super-120b-a12b:free
              - openai/gpt-oss-120b:free
              - openrouter-free
          - id: nvidia/nemotron-3-super-120b-a12b:free
            providerModel: nvidia/nemotron-3-super-120b-a12b:free
            description: Free OpenRouter 1M-context reasoning and tool-use model
            fallbackModels:
              - qwen/qwen3-coder:free
              - moonshotai/kimi-k2.6:free
              - openai/gpt-oss-120b:free
              - openrouter-free
          - id: openai/gpt-oss-120b:free
            providerModel: openai/gpt-oss-120b:free
            description: Free OpenRouter GPT-OSS 120B reasoning model
            fallbackModels:
              - openai/gpt-oss-20b:free
              - qwen/qwen3-coder:free
              - nvidia/nemotron-3-super-120b-a12b:free
              - openrouter-free
          - id: openai/gpt-oss-20b:free
            providerModel: openai/gpt-oss-20b:free
            description: Free OpenRouter lightweight GPT-OSS fallback
            fallbackModels:
              - openai/gpt-oss-120b:free
              - qwen/qwen3-coder:free
              - openrouter-free
          - id: meta-llama/llama-3.3-70b-instruct:free
            providerModel: meta-llama/llama-3.3-70b-instruct:free
            description: Free OpenRouter Llama 3.3 70B general-purpose fallback
            fallbackModels:
              - openai/gpt-oss-120b:free
              - qwen/qwen3-coder:free
              - openrouter-free
          - id: qwen/qwen3-next-80b-a3b-instruct:free
            providerModel: qwen/qwen3-next-80b-a3b-instruct:free
            description: Free OpenRouter Qwen instruction model with tools support
            fallbackModels:
              - qwen/qwen3-coder:free
              - openai/gpt-oss-120b:free
              - openrouter-free
      - id: deepseek-api
        type: openai
        description: DeepSeek API
        baseUrl: https://api.deepseek.com
        apiKeyEnv: DEEPSEEK_API_KEY
        timeoutMs: 120000
        models:
          - id: deepseek-v4-flash
            providerModel: deepseek-v4-flash
            fallbackModels:
              - deepseek-v4-pro
          - id: deepseek-v4-pro
            providerModel: deepseek-v4-pro
            fallbackModels:
              - deepseek-v4-flash
          - id: deepseek-chat
            providerModel: deepseek-chat
            description: Backward-compatible DeepSeek non-thinking alias; use deepseek-v4-flash for new traffic
            fallbackModels:
              - deepseek-v4-flash
              - deepseek-v4-pro
          - id: deepseek-coder
            providerModel: deepseek-chat
            description: Backward-compatible DeepSeek coding alias mapped to deepseek-chat; use deepseek-v4-flash for new traffic
            fallbackModels:
              - deepseek-v4-flash
              - deepseek-v4-pro
          - id: deepseek-reasoner
            providerModel: deepseek-reasoner
            description: Backward-compatible DeepSeek thinking alias; use deepseek-v4-pro for new traffic
            fallbackModels:
              - deepseek-v4-pro
              - deepseek-v4-flash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-openai-cli-gateway-home
  namespace: n8n-openai-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-openai-cli-gateway
  namespace: n8n-openai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-openai-cli-gateway
  template:
    metadata:
      labels:
        app: n8n-openai-cli-gateway
    spec:
      serviceAccountName: n8n-openai-cli-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: gemini-bootstrap
          image: ghcr.io/philly1084/n8n-openai-cli-gateway:latest
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -eu
              export HOME=/var/lib/gateway-home
              export PATH="$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              mkdir -p "$HOME/.local/bin"
              if [ ! -x "$HOME/.local/bin/gemini" ]; then
                npm install -g --prefix "$HOME/.local" @google/gemini-cli
              fi
              "$HOME/.local/bin/gemini" --version >/dev/null
          env:
            - name: HOME
              value: /var/lib/gateway-home
            - name: PATH
              value: /var/lib/gateway-home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provider-home
              mountPath: /var/lib/gateway-home
        - name: kimi-bootstrap
          image: ghcr.io/philly1084/n8n-openai-cli-gateway:latest
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -eu
              export HOME=/var/lib/gateway-home
              export PATH="$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              mkdir -p "$HOME/.local/bin"
              if [ ! -x "$HOME/.local/bin/uv" ]; then
                curl -LsSf https://astral.sh/uv/install.sh | sh
              fi
              if [ -x "$HOME/.local/bin/kimi" ]; then
                "$HOME/.local/bin/uv" tool upgrade kimi-cli --no-cache
              else
                "$HOME/.local/bin/uv" tool install --python 3.13 kimi-cli
              fi
              "$HOME/.local/bin/kimi" --version >/dev/null
          env:
            - name: HOME
              value: /var/lib/gateway-home
            - name: PATH
              value: /var/lib/gateway-home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provider-home
              mountPath: /var/lib/gateway-home
        - name: gemini-auth-bootstrap
          image: ghcr.io/philly1084/n8n-openai-cli-gateway:latest
          imagePullPolicy: Always
          command:
            - sh
            - -lc
            - |
              set -eu
              export HOME=/var/lib/gateway-home
              BOOTSTRAP_DIR=/bootstrap/gemini
              TARGET_DIR="$HOME/.gemini"
              if [ -f "$TARGET_DIR/oauth_creds.json" ]; then
                echo "Gemini auth already present in $TARGET_DIR"
                exit 0
              fi
              set -- "$BOOTSTRAP_DIR"/*
              if [ "$1" = "$BOOTSTRAP_DIR/*" ]; then
                echo "No Gemini auth bootstrap secret mounted; skipping seed"
                exit 0
              fi
              mkdir -p "$TARGET_DIR"
              cp "$BOOTSTRAP_DIR"/* "$TARGET_DIR"/
              chmod 700 "$TARGET_DIR"
              chmod 600 "$TARGET_DIR"/* || true
              echo "Seeded Gemini auth into $TARGET_DIR"
          env:
            - name: HOME
              value: /var/lib/gateway-home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provider-home
              mountPath: /var/lib/gateway-home
            - name: gemini-auth-seed
              mountPath: /bootstrap/gemini
              readOnly: true
      containers:
        - name: gateway
          image: ghcr.io/philly1084/cli-model-gateway:sha-1daaa709c4b9538897003411a1a50a42c13f3d2f
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "info"
            - name: MAX_JOB_LOG_LINES
              value: "500"
            - name: REQUEST_TIMEOUT_MS
              value: "1200000"
            - name: CODEX_APPSERVER_IMAGE_NO_PROGRESS_TIMEOUT_MS
              value: "90000"
            - name: PROVIDERS_CONFIG_PATH
              value: /app/config/providers.yaml
            - name: CODEX_EXECUTABLE
              value: codex
            - name: HOME
              value: /var/lib/gateway-home
            - name: PATH
              value: /var/lib/gateway-home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: n8nApiKey
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: adminApiKey
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: groqApiKey
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: openrouterApiKey
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: deepseekApiKey
                  optional: true
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: moonshotApiKey
                  optional: true
            - name: KIMI_CODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-openai-cli-gateway-secrets
                  key: kimiApiKey
                  optional: true
          volumeMounts:
            - name: providers-config
              mountPath: /app/config/providers.yaml
              subPath: providers.yaml
            - name: provider-home
              mountPath: /var/lib/gateway-home
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: providers-config
          configMap:
            name: n8n-openai-cli-gateway-config
        - name: provider-home
          persistentVolumeClaim:
            claimName: n8n-openai-cli-gateway-home
        - name: gemini-auth-seed
          secret:
            secretName: n8n-openai-cli-gateway-gemini-auth
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-openai-cli-gateway
  namespace: n8n-openai-gateway
  labels:
    app: n8n-openai-cli-gateway
spec:
  type: ClusterIP
  selector:
    app: n8n-openai-cli-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
